<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SEJIRE</title>
</head>
<body>
  <script>
    (function () {
      const base = "https://azovskaya.github.io/sejire_arweave_solana/native-admin/";
      const prefix = "/sejire/";
      const path = location.pathname.startsWith(prefix)
        ? location.pathname.slice(prefix.length).replace(/^\/+|\/+$/g, "")
        : "";
      const route = location.hash || (path ? "#/" + path : "");
      location.replace(base + location.search + route);
    })();
  </script>
  <p><a href="https://azovskaya.github.io/sejire_arweave_solana/native-admin/">Открыть SEJIRE</a></p>
</body>
</html>
