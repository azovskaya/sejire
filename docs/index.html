<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SEJIRE</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;color:#191919}
    main{text-align:center;padding:32px}
    h1{letter-spacing:.12em;margin:0 0 12px}
    p{margin:0;color:#666}
  </style>
</head>
<body>
  <main><h1>SEJIRE</h1><p>Открываем приложение…</p></main>
  <script>
    (function () {
      const base = "https://azovskaya.github.io/sejire_arweave_solana/native-admin/";
      const prefix = "/sejire/";
      let route = location.hash || "";
      const path = location.pathname.startsWith(prefix)
        ? location.pathname.slice(prefix.length).replace(/^\/+|\/+$/g, "")
        : "";
      if (!route && path && path !== "index.html") route = "#/" + path;
      location.replace(base + location.search + route);
    })();
  </script>
  <noscript><p><a href="https://azovskaya.github.io/sejire_arweave_solana/native-admin/">Открыть SEJIRE</a></p></noscript>
</body>
</html>
